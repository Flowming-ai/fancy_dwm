backend = "xrender";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.30;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;
active-opacity = 1.0;
inactive-opacity = 1.0;
detect-client-opacity = true;
