add_newline = true
command_timeout = 1000
format = """
[](#cba6f7)\
$username\
[](fg:#cba6f7 bg:#89b4fa)\
$directory\
[](fg:#89b4fa bg:#313244)\
$git_branch$git_status\
[](fg:#313244) \
$python$nodejs$rust$golang$cmd_duration\
$line_break$character"""

[username]
show_always = true
style_user = 'bg:#cba6f7 fg:#1e1e2e bold'
style_root = 'bg:#cba6f7 fg:#f38ba8 bold'
format = '[  $user ]($style)'

[directory]
style = 'bg:#89b4fa fg:#1e1e2e bold'
format = '[ $path$read_only ]($style)'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' '

[git_branch]
symbol = ' '
style = 'bg:#313244 fg:#a6e3a1'
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'bg:#313244 fg:#f9e2af'
format = '[$all_status$ahead_behind ]($style)'

[python]
symbol = ' '
format = '[$symbol$version ($virtualenv) ](fg:#f9e2af)'
[nodejs]
symbol = ' '
format = '[$symbol$version ](fg:#a6e3a1)'
[rust]
symbol = ' '
format = '[$symbol$version ](fg:#fab387)'
[golang]
symbol = ' '
format = '[$symbol$version ](fg:#89dceb)'
[cmd_duration]
min_time = 2000
format = '[  $duration](fg:#f9e2af)'
[character]
success_symbol = '[❯](bold #cba6f7)'
error_symbol = '[❯](bold #f38ba8)'
vicmd_symbol = '[❮](bold #a6e3a1)'
